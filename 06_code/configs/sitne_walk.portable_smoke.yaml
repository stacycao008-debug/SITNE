# 合成数据软件验证配置；scientific_evidence=false。
data:
  train_path: "sample_data/train.tsv"
  validation_path: "sample_data/validation.tsv"
  test_path: "sample_data/test.tsv"
  split_manifest_path: null
  require_manifest_hashes: false
  all_known_positive_paths: ["sample_data/all_known_positives.tsv"]
  relation_metadata_path: null
  relation_hierarchy_path: null
  weight_column: null
  duplicate_policy: "binary"
  pair_semantics: "unordered"
  default_relation_mode: "symmetric"
  drop_self_loops_from_walks: true

walk:
  alpha: 0.5
  beta: 0.5
  epsilon: 1.0e-12
  walk_length: 6
  walks_per_protein: 2
  walk_batch_size: 8
  context_window: 2
  negative_samples: 2
  negative_distribution: "unigram"
  unigram_power: 0.75
  max_topology_pairs_per_batch: 512

model:
  embedding_dim: 16
  decoder_dropout: 0.0
  nuisance_hidden_dim: 16
  nuisance_heads: ["degree"]

loss:
  lambda_typed: 1.0
  lambda_decorr: 0.01
  lambda_adversary: 0.1
  lambda_rank: 1.0
  lambda_hierarchy: 0.0
  gradient_reversal_coefficient: 1.0
  rank_margin: 0.0
  hierarchy_margin: 0.0

training:
  device: "auto"
  seed: 42
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip_norm: 5.0
  rank_batch_size: 8
  early_stopping_patience: 1
  evaluation_batch_size: 16
  use_amp: false
  amp_dtype: "float16"
  deterministic: true
  allow_tf32: false
  max_steps_per_epoch: 2
  log_interval: 1
  output_dir: "08_results/portable_smoke"

evaluation:
  tie_policy: "average"
  hits_at: [1, 3, 10]
  require_full_coverage: true
