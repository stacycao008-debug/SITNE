# SITNE-Walk 最优配置 (HPO Round 3 Trial #95, MRR=0.9551)
# 5-fold CV 正式训练
data:
  train_path: "FOLD_TRAIN_PLACEHOLDER"
  validation_path: "FOLD_VAL_PLACEHOLDER"
  test_path: "FOLD_TEST_PLACEHOLDER"
  split_manifest_path: "05_splits/typed_ranking_v2/split_manifest.json"
  require_manifest_hashes: false
  all_known_positive_paths: ["05_splits/typed_ranking_v2/all_known_positives.tsv"]
  relation_metadata_path: null
  relation_hierarchy_path: null
  weight_column: null
  duplicate_policy: "binary"
  pair_semantics: "unordered"
  default_relation_mode: "symmetric"
  drop_self_loops_from_walks: true

walk:
  alpha: 0.25
  beta: 0.0
  epsilon: 1.0e-12
  correction_mode: "rank"
  walk_length: 81
  walks_per_protein: 16
  walk_batch_size: 64
  context_window: 1
  negative_samples: 16
  negative_distribution: "unigram"
  unigram_power: 0.75
  max_topology_pairs_per_batch: 2048

model:
  embedding_dim: 512
  decoder_dropout: 0.1
  nuisance_hidden_dim: 32
  nuisance_heads: ["degree"]

loss:
  lambda_typed: 1.864
  lambda_decorr: 0.000255
  lambda_adversary: 0.00000506
  lambda_rank: 25.64
  lambda_hierarchy: 0.0
  gradient_reversal_coefficient: 1.0
  rank_margin: 0.0
  hierarchy_margin: 0.0

training:
  device: "auto"
  seed: SEED_PLACEHOLDER
  epochs: 50
  learning_rate: 0.01923
  weight_decay: 0.00001
  gradient_clip_norm: 2.0
  rank_batch_size: 64
  early_stopping_patience: 5
  evaluation_batch_size: 128
  use_amp: true
  amp_dtype: "float16"
  deterministic: true
  allow_tf32: false
  max_steps_per_epoch: null
  log_interval: 50
  output_dir: "OUTPUT_DIR_PLACEHOLDER"

evaluation:
  tie_policy: "average"
  hits_at: [1, 3, 10]
  require_full_coverage: false
