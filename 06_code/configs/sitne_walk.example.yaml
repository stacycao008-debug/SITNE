# SITNE-Walk v1 示例配置。
#
# 注意：当前 split1 与 split2 的 TSV 实体相同；本配置仅用于代码/流程验证，
# 不能据此形成 random-vs-pair 科学结论。正式实验必须换成重新冻结且带 hash 的
# split manifest，并把 require_manifest_hashes 改为 true。

data:
  train_path: "05_splits/split1_random/train.tsv"
  validation_path: "05_splits/split1_random/validation.tsv"
  test_path: "05_splits/split1_random/test.tsv"
  split_manifest_path: "05_splits/split1_random/split_manifest.json"
  require_manifest_hashes: false
  all_known_positive_paths:
    - "05_splits/positive_manifest.tsv"
  relation_metadata_path: null
  relation_hierarchy_path: null
  weight_column: null
  duplicate_policy: "binary"
  pair_semantics: "unordered"
  default_relation_mode: "symmetric"
  drop_self_loops_from_walks: true

walk:
  alpha: 0.5
  beta: 0.5
  epsilon: 1.0e-12
  walk_length: 40
  walks_per_protein: 10
  walk_batch_size: 256
  context_window: 5
  negative_samples: 5
  negative_distribution: "unigram"
  unigram_power: 0.75
  max_topology_pairs_per_batch: 32768

model:
  embedding_dim: 128
  decoder_dropout: 0.1
  nuisance_hidden_dim: 128
  nuisance_heads:
    - "degree"

loss:
  lambda_typed: 1.0
  lambda_decorr: 0.01
  lambda_adversary: 0.1
  lambda_rank: 1.0
  lambda_hierarchy: 0.0
  gradient_reversal_coefficient: 1.0
  rank_margin: 0.0
  hierarchy_margin: 0.0

training:
  # 显式 cuda 不可用时立即报错；改为 auto 才允许 CUDA -> MPS -> CPU。
  device: "cuda"
  seed: 42
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip_norm: 5.0
  rank_batch_size: 1024
  early_stopping_patience: 5
  evaluation_batch_size: 1024
  use_amp: true
  amp_dtype: "float16"
  deterministic: true
  allow_tf32: false
  max_steps_per_epoch: null
  log_interval: 20
  output_dir: "08_results/sitne_walk"

evaluation:
  tie_policy: "average"
  hits_at: [1, 3, 10]
  # 当前历史 split 含 train-unseen protein/relation，正式评测应保持 true 并拒绝
  # 不完整覆盖；仅诊断时可显式改为 false，结果会标记 partial_coverage。
  require_full_coverage: true

